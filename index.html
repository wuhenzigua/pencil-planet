<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="手绘涂鸦风的增量放置小游戏：点击小星球产出墨水，雇佣文具自动画画。">
<title>铅笔小星球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a notebook spread — the doodled planet fills the left page, the tool drawer sits right of the red margin line */
:root{
  --paper:#f5f7fa; --grid:#dbe4ef; --margin:#ee9a9a;
  --ink:#2b2e35; --soft:#727a88; --card:#fffefb; --shadow:#2b2e35;
  --blue:#2c5fd6; --gold:#f4b62e; --hl:#fde68a; --good:#3f9a5a; --warn:#d9472f; --wood:#f1d3a6;
  --planet:#d6e6fb; --hatch:#8aa6d4;
  --c1:#f5c542; --c2:#e75b45; --c3:#22a596; --c4:#4677de; --c5:#e2559f;
  --c6:#8b67d4; --c7:#f0883a; --c8:#45b2e3; --c9:#f2b02c; --c10:#5a49b6;
  --f-num:"Gaegu","ZCOOL KuaiLe","Comic Sans MS",cursive;
  --f-cn:"ZCOOL KuaiLe","Gaegu","PingFang SC",cursive;
  --sk:255px 14px 225px 14px/14px 225px 14px 255px;
  --sk2:15px 225px 15px 255px/225px 15px 255px 15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c2326; --grid:#273035; --margin:#7a4545;
    --ink:#ecebe4; --soft:#9aa4a8; --card:#242c30; --shadow:#0b0f11;
    --blue:#86b0ff; --gold:#f6c453; --hl:#4d4622; --good:#7cc78e; --warn:#ff7a5f; --wood:#9c7d58;
    --planet:#2a3e5a; --hatch:#6f8fc2;
    --c6:#a68af0; --c10:#8d7ff0; --c4:#6a95f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1c2326; --grid:#273035; --margin:#7a4545;
  --ink:#ecebe4; --soft:#9aa4a8; --card:#242c30; --shadow:#0b0f11;
  --blue:#86b0ff; --gold:#f6c453; --hl:#4d4622; --good:#7cc78e; --warn:#ff7a5f; --wood:#9c7d58;
  --planet:#2a3e5a; --hatch:#6f8fc2;
  --c6:#a68af0; --c10:#8d7ff0; --c4:#6a95f0;
  color-scheme:dark;
}
/* notebook papers unlocked by 换本子 — each is a single deliberate look */
:root.paper-kraft{
  --paper:#d8b98d; --grid:#caa877; --margin:#a8553f; --ink:#3a2a1c; --soft:#6d5640; --card:#ecd6b0; --shadow:#3a2a1c;
  --blue:#2c5fd6; --gold:#e9a81f; --hl:#f7dd7f; --good:#3f8a4a; --warn:#c2412b; --wood:#b98a52;
  --planet:#f0dcb8; --hatch:#9b7a52; --c4:#4677de; --c6:#8b67d4; --c10:#5a49b6; color-scheme:light;
}
:root.paper-black{
  --paper:#151515; --grid:#232323; --margin:#5c3030; --ink:#f2efe6; --soft:#a39e94; --card:#1f1f1f; --shadow:#000;
  --blue:#86b0ff; --gold:#f6c453; --hl:#4a4320; --good:#7cc78e; --warn:#ff7a5f; --wood:#9c7d58;
  --planet:#2b2b2b; --hatch:#8c8c8c; --c4:#6a95f0; --c6:#a68af0; --c10:#8d7ff0; color-scheme:dark;
}
:root.paper-blue{
  --paper:#1d3f73; --grid:#2b5590; --margin:#7fa8e0; --ink:#eaf2ff; --soft:#a9c1e6; --card:#24508c; --shadow:#0e2447;
  --blue:#bfe0ff; --gold:#ffd166; --hl:#3d6aa8; --good:#8fe3a4; --warn:#ff8a70; --wood:#c9a77c;
  --planet:#2d5a99; --hatch:#bcd3f5; --c4:#8fb6ff; --c6:#c3a8ff; --c10:#b3a6ff; color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%; margin:0; overflow:hidden; color:var(--ink);
  font-family:var(--f-num); font-size:18px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
[data-tip]{-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.ico{width:1em;height:1em;flex:none;overflow:visible;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#wob)}
@media (prefers-reduced-motion: reduce){.ico{filter:none}}

.app{
  height:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(330px,410px);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none}
#scene{position:absolute;inset:0;display:block}
.planet-hit{position:absolute;border-radius:50%;z-index:2}
.planet-hit:focus-visible{outline-offset:6px}

.hud{position:absolute;left:4px;top:12px;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.hud-ink{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(36px,5vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.hud-ink .ico{font-size:.8em}
.hud-rate{font-size:22px;color:var(--soft);padding-left:4px;font-variant-numeric:tabular-nums}
.goal{pointer-events:auto;display:flex;align-items:center;gap:6px;width:180px;padding:2px 4px;margin-top:2px}
.goal .ico{font-size:26px}
.goal .gb{flex:1;height:11px;border:2px solid var(--ink);border-radius:var(--sk);overflow:hidden;background:var(--card)}
.goal .gb i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.hud-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;pointer-events:auto;max-width:300px}
.buffs{display:flex;gap:8px}
.buff{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p)*360deg),transparent 0);padding:4px}
.buff>span{width:100%;height:100%;border-radius:50%;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font-size:22px}
.buff b{position:absolute;right:-10px;bottom:-6px;font-size:16px;background:var(--card);border:2px solid var(--ink);border-radius:var(--sk);padding:0 4px;line-height:1.2}
.cardbtn{position:relative;animation:wig 1.6s ease-in-out infinite;background:var(--hl)}
.cardbtn .dot,.tab .dot{position:absolute;right:-8px;top:-9px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--warn);color:#fff;font-size:16px;font-weight:700;line-height:20px;border:2px solid var(--ink);text-align:center}
.chip{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 8px;font-size:22px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:2px 2px 0 var(--shadow)}
.chip span{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.chip .x{width:30px;height:30px;font-size:22px;display:grid;place-items:center;border-radius:50%}
.chip .x.arm{background:var(--warn);animation:shake .4s infinite}
.hud-r{position:absolute;right:6px;top:14px;z-index:3;display:flex;align-items:center;gap:10px}
.stk{display:flex;align-items:center;gap:4px;font-weight:700;font-size:24px}
.stk .ico{font-size:26px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;font-size:26px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:2px 2px 0 var(--shadow)}
.iconbtn:active{transform:translate(2px,2px);box-shadow:none}
.iconbtn.on{background:var(--hl)}

.gstar{position:absolute;z-index:4;width:70px;height:70px;font-size:70px;margin:-35px 0 0 -35px;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--gold))}
.gstar.out{animation:fadeout .5s forwards}
@keyframes bob{0%,100%{transform:translateY(-6px) rotate(-12deg) scale(1)}50%{transform:translateY(6px) rotate(12deg) scale(1.08)}}
@keyframes fadeout{to{opacity:0;transform:scale(.3) rotate(90deg)}}

.toasts{position:absolute;left:4px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;font-size:28px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:3px 3px 0 var(--shadow);animation:toastin .35s cubic-bezier(.2,1.6,.4,1) both}
.toast b{font-size:20px}
.toast.gone{animation:toastout .4s forwards}
@keyframes toastin{from{transform:translateX(-120%) rotate(-8deg)}}
@keyframes toastout{to{transform:translateY(20px);opacity:0}}

/* panel */
.panel{position:relative;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px 24px 26px;
  border-left:2px solid var(--margin);box-shadow:-5px 0 0 -3px var(--margin)}
.tabs{position:sticky;top:0;z-index:4;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding:12px 0 10px;background:var(--paper)}
.tab{position:relative;height:54px;font-size:32px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:var(--sk2);background:var(--card);box-shadow:3px 3px 0 var(--shadow)}
.tab[aria-selected="true"]{background:var(--hl);transform:rotate(-2deg) translateY(2px);box-shadow:1px 1px 0 var(--shadow)}
.pane{display:flex;flex-direction:column;gap:12px}
.sub{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;margin-top:6px}
.sub .ico{font-size:28px}
.sub span{color:var(--soft);font-weight:400;font-size:18px}

.quests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quest{position:relative;height:56px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:30px;overflow:hidden;
  border:2px dashed var(--soft);border-radius:var(--sk2);background:var(--card)}
.quest b{font-size:20px;font-weight:700}
.quest i{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--good)}
.quest.done{border:2.5px solid var(--ink);background:var(--hl);box-shadow:2px 2px 0 var(--shadow);animation:wig 1.8s ease-in-out infinite}

.amt{display:flex;gap:8px;justify-content:flex-end}
.amt button{font-size:20px;font-weight:700;padding:2px 12px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--card)}
.amt button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.ups{display:flex;flex-wrap:wrap;gap:10px}
.ups:empty{display:none}
.up{position:relative;width:56px;height:56px;font-size:34px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:var(--sk2);background:var(--card);box-shadow:2px 2px 0 var(--shadow);opacity:.45}
.up.ok{opacity:1;background:var(--hl);animation:wig 2.4s ease-in-out infinite}
.up.more{opacity:1;font-size:22px;font-weight:700;border-style:dashed}
.up i{position:absolute;right:-7px;bottom:-7px;font-style:normal;font-size:15px;font-weight:700;min-width:22px;height:22px;line-height:19px;text-align:center;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.up .sb{position:absolute;right:-8px;bottom:-8px;width:28px;height:28px;font-size:20px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.up .tag{position:absolute;left:-6px;top:-8px;font-size:14px;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:var(--sk);padding:0 3px;line-height:1.1}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-6deg)}96%{transform:rotate(5deg)}}

.prods{display:flex;flex-direction:column;gap:10px}
.prod{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 12px 6px 8px;text-align:left;
  border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:3px 3px 0 var(--shadow);transition:transform .08s}
.prod:nth-child(even){border-radius:var(--sk2)}
.prod .pi{font-size:50px;display:grid;place-items:center}
.prod .po{font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.prod .pm{display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.15;font-variant-numeric:tabular-nums}
.prod .pc{display:flex;align-items:center;gap:4px;font-size:22px;font-weight:700}
.prod .pc .ico{font-size:18px}
.prod .pc small{font-size:15px;color:var(--soft);font-weight:400}
.prod .pr{font-size:16px;color:var(--soft)}
.prod.ok{background-image:linear-gradient(100deg,transparent 3%,var(--hl) 5%,var(--hl) 93%,transparent 97%)}
.prod:not(.ok){opacity:.62}
.prod.blk{opacity:.25}
.prod:active{transform:translate(2px,2px)}
.prod.mys .pi .ico{filter:brightness(0) opacity(.22)}
.prod.mys .po{color:var(--soft)}
.prod.pop .pi{animation:pop .35s}
.flash{animation:flash .9s}
.shake{animation:shake .3s}
@keyframes pop{40%{transform:scale(1.3) rotate(-10deg)}}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes flash{0%,60%{box-shadow:0 0 0 5px var(--blue)}}

/* achievements */
.ach-head,.pg-stats{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700}
.ach-head .ico,.pg-stats .ico{font-size:30px}
.ach-head span,.pg-stats span{color:var(--soft);font-size:20px;font-weight:400}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:10px}
.ach{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:28px;border-radius:50%;border:2px dashed var(--soft);opacity:.5}
.ach .ico{filter:grayscale(1) url(#wob)}
.ach.got{border:2.5px solid var(--ink);background:radial-gradient(circle,var(--card) 56%,var(--gold) 58%);opacity:1;box-shadow:2px 2px 0 var(--shadow)}
.ach.got .ico{filter:url(#wob)}
.ach.hid{font-size:30px;font-weight:700;color:var(--soft)}
.ach b{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:13px;line-height:1.1;padding:0 3px;white-space:nowrap;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--sk)}
.ach:not(.got) b{border-color:var(--soft);color:var(--soft)}

/* page turn */
.pg{display:flex;flex-direction:column;gap:12px;padding:14px;border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:3px 3px 0 var(--shadow)}
.pg-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pg-top>.ico{font-size:72px}
.pg-gain{display:flex;align-items:center;gap:6px;font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.pg-gain .ico{font-size:44px}
.bar{height:16px;border:2px solid var(--ink);border-radius:var(--sk);overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,var(--c1) 6px 12px)}
.pg-next{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:16px;color:var(--soft)}
.turn{display:flex;align-items:center;justify-content:center;gap:12px;height:62px;font-size:40px;border:2.5px solid var(--ink);border-radius:var(--sk2);background:var(--hl);box-shadow:3px 3px 0 var(--shadow)}
.turn:disabled{background:var(--paper);opacity:.45;cursor:not-allowed}
.turn.arm{background:var(--warn);animation:wig 1s ease-in-out infinite}
.turn .q{font-size:34px;font-weight:700;display:none}
.turn.arm .q{display:inline}
.cardrow{display:flex;flex-wrap:wrap;gap:8px}
.cardrow:empty{display:none}
.cchip{display:flex;align-items:center;gap:4px;padding:2px 8px;font-size:22px;border:2px solid var(--ink);border-radius:var(--sk2);background:var(--card);border-top:5px solid var(--sc)}
.cchip b{font-size:17px}
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px}
.perk{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:36px;border:2px solid var(--ink);border-radius:var(--sk2);background:var(--card);box-shadow:2px 2px 0 var(--shadow);opacity:.5}
.perk.ok{opacity:1;background:var(--hl)}
.perk.own{opacity:1;background:var(--card);border-width:3px}
.perk.rp{border-style:double;border-width:4px}
.perk b{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;font-size:15px;line-height:1.2;padding:0 4px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--sk);white-space:nowrap}
.perk b .ico{font-size:13px}
.perk .chk{position:absolute;right:-8px;top:-8px;font-size:24px;background:var(--card);border-radius:50%}
.perk .lv{position:absolute;right:-8px;top:-8px;min-width:24px;height:24px;font-size:15px;font-weight:700;line-height:20px;text-align:center;border-radius:12px;border:2px solid var(--ink);background:var(--card)}

/* challenges */
.chals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 8px;border:2px solid var(--ink);border-radius:var(--sk2);background:var(--card);box-shadow:2px 2px 0 var(--shadow)}
.chal .ci{position:relative;font-size:40px;display:grid;place-items:center}
.chal .ci .no{position:absolute;font-size:52px}
.chal .cg{display:flex;align-items:center;gap:3px;font-size:17px;font-weight:700}
.chal .cg .ico{font-size:15px}
.chal.done{background:var(--hl)}
.chal.on{border-width:3.5px;border-color:var(--blue)}
.chal.arm{background:var(--warn);animation:wig 1s infinite}
.chal .chk{position:absolute;right:-8px;top:-8px;font-size:24px;background:var(--card);border-radius:50%}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--shadow)}
.sw.sq{border-radius:var(--sk2);background-size:9px 9px}
.sw.sel{outline:3px dashed var(--blue);outline-offset:3px}
.sw.lock{opacity:.3;border-style:dashed;box-shadow:none;cursor:default}

/* settings */
.set-row{display:flex;flex-wrap:wrap;gap:12px}
.set-row .iconbtn{width:58px;height:58px;font-size:32px}
.set-row .iconbtn.arm{background:var(--warn);animation:shake .4s infinite}
textarea{width:100%;min-height:84px;font:14px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:var(--sk2);padding:8px;user-select:text;-webkit-user-select:text}
.imp{display:flex;gap:10px;align-items:flex-start}
.stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.stats li{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0}
.stats .ico{font-size:28px}

/* overlays */
.tip{position:fixed;z-index:60;pointer-events:none;max-width:240px;padding:6px 12px;font-family:var(--f-cn);font-size:16px;line-height:1.35;
  border:2px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:3px 3px 0 var(--shadow);display:flex;flex-direction:column;gap:2px}
.tip b{font-size:19px;font-weight:400}
.tip span{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:18px;color:var(--soft)}
.tip .ico{font-size:16px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:color-mix(in srgb,var(--shadow) 35%,transparent);padding:16px}
.mcard{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;padding:22px 26px;border:2.5px solid var(--ink);border-radius:var(--sk);background:var(--card);box-shadow:5px 5px 0 var(--shadow);animation:toastin .4s cubic-bezier(.2,1.6,.4,1) both}
.mcard>.ico{font-size:84px}
.mbig{display:flex;align-items:center;gap:8px;font-size:52px;font-weight:700}
.mbig .ico{font-size:40px}
.msmall{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--soft)}
.mcard>.iconbtn{width:70px;height:56px;font-size:34px;background:var(--hl)}
.cards{display:flex;gap:12px;justify-content:center}
.card{position:relative;width:clamp(86px,27vw,124px);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:52px;overflow:hidden;
  border:2.5px solid var(--ink);border-radius:var(--sk2);background:var(--card);box-shadow:4px 4px 0 var(--shadow);transition:transform .15s}
.card::before{content:"";position:absolute;inset:0 0 auto;height:14px;background:var(--sc)}
.card b{font-size:28px}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-2deg)}
.flip{position:fixed;inset:0;z-index:80;transform-origin:left center;background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 60px,var(--margin) 60px,var(--margin) 62px,transparent 62px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,26px 26px,26px 26px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(260px,50%) minmax(0,1fr)}
  .panel{border-left:0;box-shadow:none;border-top:2px solid var(--margin);padding:0 2px 24px}
  .tabs{padding:8px 0;gap:6px}
  .tab{height:46px;font-size:28px}
  .hud{top:8px}
  .hud-rate{font-size:18px}
  .goal{width:140px}
  .hud-r{top:8px}
  .prod .pi{font-size:42px}
  .prod{grid-template-columns:48px minmax(0,1fr) auto}
  .toasts{left:auto;right:4px;top:62px;bottom:auto;align-items:flex-end;gap:4px}
  .toast{font-size:20px;padding:3px 8px 3px 6px}
  .toast b{font-size:16px}
  .perks{gap:14px 10px}
}
</style>

function questOK(q) {

}
function newQuest() {
  for (let tries = 0; tries < 12; tries++) {
    const r = Math.random(); let q;
    if (r < 0.5) { let maxI = 0; P.forEach((p, i) => { if (revealed(i) && canBuyProd(i)) maxI = i; }); const i = randi(Math.max(0, maxI - 3), maxI); q = { t: 'buy', i, n: [5, 10, 15][randi(0, 2)], b: S.owned[i] }; }
    else if (r < 0.72) q = { t: 'click', n: [50, 100, 200][randi(0, 2)], b: S.clicks };
    else if (r < 0.86) q = { t: 'gold', n: 1, b: S.goldenClicks };

function endChal(win) {

/* ---------- tick ---------- */
function tick(dt) {
  S.t += dt;
  const b = baseIps();
  let gain = b * dt;
  if (S.buffs.f > 0) { gain += b * 6 * Math.min(dt, S.buffs.f); S.buffs.f = Math.max(0, S.buffs.f - dt); }
  if (S.buffs.c > 0) S.buffs.c = Math.max(0, S.buffs.c - dt);
  earn(gain);
  lastIps = curIps();
  if (S.perks.auto && !chalOn('noclick')) {
    autoAcc += dt * 2;
    const k = Math.floor(autoAcc);
    if (k > 4) { earn(clickValue() * k); autoAcc -= k; }
    else while (autoAcc >= 1) { autoAcc -= 1; doClick(null, null, true); }
  }
  if (!golden.active) { S.goldenIn -= dt; if (S.goldenIn <= 0) spawnGolden(); }
  else { golden.life -= dt; if (golden.life <= 0) despawnGolden(false); }
  if (!er.active) { er.next -= dt; if (er.next <= 0) spawnEraser(); }
  else { er.a += er.dir * 0.32 * dt; er.life -= dt; if (er.life <= 0) { er.active = false; er.next = rand(90, 200); } }
  checkCards();
  if (S.chal) {
    S.chalT += dt;
    const c = CHAL.find(x => x.id === S.chal);
    if (c && S.runInk >= c.goal) endChal(true);
    else if (S.chal === 'timed' && S.chalT > 900) endChal(false);
  }
  squish *= Math.exp(-dt * 9);
  fx.rocketPh += dt * 0.6 * (fx.rocketBoost > tNow ? 4 : 1);
  if (!REDUCED) rot += dt * 0.05;
  if (blinkT > 0) blinkT -= dt; else { nextBlink -= dt; if (nextBlink <= 0) { blinkT = 0.13; nextBlink = rand(2.5, 6); } }
}

function showTip(t, touch) { tipEl = t; renderTip(t); if (!tip.innerHTML) { hideTip(); return; } placeTip(t); clearTimeout(tipTimer); if (touch) tipTimer = setTimeout(hideTip, 1800); }
function hideTip() { tipEl = null; tip.hidden = true; }
document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const t = e.target.closest('[data-tip]'); if (t && t !== tipEl) showTip(t, false); else if (!t && tipEl) hideTip(); });
document.addEventListener('pointerleave', hideTip);
$('#panel').addEventListener('scroll', hideTip, { passive: true });
let lpTimer = 0, lpFired = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  clearTimeout(lpTimer); lpFired = false;
  const t = e.target.closest('[data-tip]'); if (!t) return;
  lpTimer = setTimeout(() => { lpFired = true; showTip(t, true); }, 500);
}, true);
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpTimer), true));
document.addEventListener('click', e => { if (lpFired) { lpFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-tip]')) e.preventDefault(); });

/* stage input: clicks, eraser, eggs, drag-to-spin */
const planetBtn = $('#planet');
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button:not(#planet)') || e.target.closest('.chip,.buff')) return;
  const sr = stage.getBoundingClientRect(), x = e.clientX - sr.left, y = e.clientY - sr.top, g = geom();
  if (er.active) { const p = eraserPos(); if (Math.hypot(x - p.x, y - p.y) < g.R * 0.26) { e.preventDefault(); catchEraser(p); return; } }
  for (const t of hitT) if (Math.hypot(x - t.x, y - t.y) < t.r) {
    if (t.k === 'moon') { fx.moonWink = tNow + 1.6; egg('moon'); sTone([660, 990], 'sine', 0.12, 0.06); }
    if (t.k === 'rocket') { fx.rocketBoost = tNow + 3; egg('rocket'); sTone([300, 600], 'sawtooth', 0.3, 0.04); }
    e.preventDefault(); return;
  }
  const d = Math.hypot(x - g.cx, y - g.cy);
  if (d > g.R * 0.86 && d < g.R * 1.45 && decoEgg(x, y, g) && d > g.R * 1.12) { e.preventDefault(); return; }
  if (d <= g.R * 1.12) {
    e.preventDefault(); doClick(x, y, false);
    drag = { id: e.pointerId, lastX: e.clientX };
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
});
stage.addEventListener('pointermove', e => {
  const sr = stage.getBoundingClientRect(); pointer.x = e.clientX - sr.left; pointer.y = e.clientY - sr.top;
  const g = geom();
  if (drag && e.pointerId === drag.id) {
    const dx = e.clientX - drag.lastX; drag.lastX = e.clientX;
    rot += dx / g.R; spinAcc += Math.abs(dx) / g.R;
    if (spinAcc >= TAU) { egg('spin'); }
  }
  const over = Math.hypot(pointer.x - g.cx, pointer.y - g.cy) < g.R * 1.12 || hitT.some(t => Math.hypot(pointer.x - t.x, pointer.y - t.y) < t.r);
  stage.style.cursor = drag ? 'grabbing' : over ? 'pointer' : 'default';
});
['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, e => { if (drag && e.pointerId === drag.id) drag = null; }));
planetBtn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); doClick(null, null, false); } });

/* sound & settings toggles */
function syncSnd() { const h = S.muted ? '#i-mute' : '#i-snd'; $('#sndUse').setAttribute('href', h); $('#sSndUse').setAttribute('href', h); }
const toggleSnd = () => { S.muted = !S.muted; syncSnd(); if (!S.muted) sBuy(); };
$('#snd').addEventListener('click', toggleSnd); $('#sSnd').addEventListener('click', toggleSnd);
$('#sSci').addEventListener('click', () => { S.sci = !S.sci; upKey = ''; buildAch(); buildPerks(); buildChal(); updateUI(true); });

function armed(btn, fn) {
  if (btn.classList.contains('arm')) { btn.classList.remove('arm'); clearTimeout(btn._t); fn(); return; }
  btn.classList.add('arm'); btn._t = setTimeout(() => btn.classList.remove('arm'), 3000);
}

/* resets */
const flipEl = $('#flip');
function flipThen(fn) {
  sTone([392, 523, 659, 784], 'triangle', 0.2, 0.1);
  if (REDUCED || !flipEl.animate) { fn(); return; }
  flipEl.hidden = false;
  const a1 = flipEl.animate([{ transform: 'perspective(1800px) rotateY(-95deg)' }, { transform: 'perspective(1800px) rotateY(0deg)' }], { duration: 520, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
  a1.onfinish = () => {
    fn();
    const a2 = flipEl.animate([{ transform: 'perspective(1800px) rotateY(0deg)' }, { transform: 'perspective(1800px) rotateY(-95deg)' }], { duration: 620, delay: 120, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
    a2.onfinish = () => { flipEl.hidden = true; a1.cancel(); a2.cancel(); };
  };
}
function resetRun(gainStickers) {
  if (gainStickers) { const g = pending(); if (g > 0) { S.stickers += g; S.pages++; } }
  S.ink = 0; S.runInk = 0; S.owned = P.map(() => 0); S.buffs = { f: 0, fd: 1, c: 0, cd: 1 };
  const keep = {}; if (S.perks.keep) Object.keys(S.ups).forEach(id => { const u = UPG_BY[id]; if (u && (u.type === 'prod' || u.type === 'click') && u.tier < 2) keep[id] = true; });
  S.ups = keep;
  if (S.perks.start) S.owned[0] = 10;
  S.cards = []; S.cardNext = 0; S.cardPend = 0; S.cardOffer = null;
  S.chal = null; S.chalT = 0;
  floats.length = 0; parts.length = 0; decoKey = ''; upKey = ''; upOpen = false;
  if (golden.active) { golden.active = false; gstar.hidden = true; }
  S.goldenIn = goldInterval(); er.active = false; er.next = rand(80, 160);
  fillQuests(true);
  checkAch(false); buildChal(); save(); updateUI(true);
}
$('#turn').addEventListener('click', e => { if (pending() < 1) return; armed(e.currentTarget, () => flipThen(() => { if (pending() >= 1) resetRun(true); })); });
$('#bookBtn').addEventListener('click', e => {
  if (S.stickers < BOOK_AT || clipGain() < 1) return;
  armed(e.currentTarget, () => flipThen(() => {
    const g = clipGain(); if (g < 1) return;
    S.clips += g; S.books++;
    S.perks = {}; S.rp = { prod: 0, click: 0, gold: 0, off: 0 }; S.ups = {};
    resetRun(false);
    S.stickers = 0; S.spent = 0; S.allInk = 0;
    S.paper = Math.min(S.books, PAPERS.length - 1); applyPaper();
    buildPerks(); buildPapers(); checkAch(false); save(); updateUI(true);
  }));
});

/* settings: export / import / reset */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
$('#sExp').addEventListener('click', () => {
  const box = $('#impBox'), ta = $('#saveTxt'); S.lastSave = Date.now();
  box.hidden = false; ta.value = enc(S); ta.select();
  try { navigator.clipboard.writeText(ta.value).then(() => flash($('#sExp')), () => {}); } catch (e) { /* ignore */ }
});
$('#sImp').addEventListener('click', () => { const box = $('#impBox'), ta = $('#saveTxt'); box.hidden = false; ta.value = ''; ta.focus(); });
$('#impGo').addEventListener('click', () => {
  try { const o = dec($('#saveTxt').value); if (!o || !Array.isArray(o.owned)) throw new Error('bad'); S = migrate(o); afterLoad(); save(); flash($('#impGo')); $('#impBox').hidden = true; }
  catch (e) { shakeEl($('#impGo')); sNo(); }
});
$('#sReset').addEventListener('click', e => armed(e.currentTarget, () => { const m = S.muted; S = newState(); S.muted = m; afterLoad(); save(); }));
function flash(b) { b.style.background = 'var(--hl)'; setTimeout(() => { b.style.background = ''; }, 600); }

/* modal */
let modalClosable = false;
function showModal(html, opt) {
  opt = opt || { ok: true };
  const m = $('#modal'); modalClosable = !!opt.closable;
  $('#mcard').innerHTML = html + (opt.ok !== false ? `<button class="iconbtn" id="mOk" aria-label="好">${ic('check')}</button>` : '');
  m.hidden = false;
  const ok = $('#mOk'); if (ok) { ok.addEventListener('click', () => { hideModal(); sBuy(); }); ok.focus(); }
}
function hideModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (modalClosable && e.target.id === 'modal') hideModal(); });

/* save / load */
let saveFail = false, lastBak = 0;
function save() {
  S.lastSave = Date.now();
  try {
    const s = JSON.stringify(S);
    localStorage.setItem(SAVE_KEY, s);
    if (Date.now() - lastBak > 300000) { localStorage.setItem(BAK_KEY, s); lastBak = Date.now(); }
    saveFail = false;
  } catch (e) { saveFail = true; }
  $('#setDot').hidden = !saveFail; $('#saveWarn').hidden = !saveFail;
}
function load() {
  for (const key of [SAVE_KEY, BAK_KEY]) {
    try { const raw = localStorage.getItem(key); if (!raw) continue; const o = JSON.parse(raw); if (o && Array.isArray(o.owned)) return migrate(o); } catch (e) { /* try backup */ }
  }
  return null;
}
function afterLoad() {
  achCount = 0; checkAch(true); decoKey = ''; upKey = ''; qKey = ''; cardRowKey = null;
  applyPaper(); fillQuests(false);
  buildAch(); buildPerks(); buildChal(); buildPapers(); syncAmt(); syncSnd(); updateUI(true);
}
function away(sec) {
  const cap = offCap(), rate = S.perks.night ? 1 : 0.5, eff = Math.min(sec, cap);
  const gain = baseIps() * eff * rate;
  S.buffs.f = Math.max(0, S.buffs.f - sec); S.buffs.c = Math.max(0, S.buffs.c - sec);
  if (S.chal) S.chalT += sec;
  S.goldenIn = Math.min(S.goldenIn, 5);
  if (gain <= 0) return;
  earn(gain);
  showModal(`${ic('moon')}<div class="mbig">+${fmt(gain)}${ic('ink')}</div><div class="msmall">${ic('clock')}${fmtT(eff)}${sec > cap ? ' / ' + fmtT(cap) : ''} · ${Math.round(rate * 100)}%</div>`);
}

/* ---------- boot ---------- */
let started = false;
function start(data) {
  if (started) return; started = true;
  const hot = data && data.S;
  S = hot ? migrate(data.S) : (load() || newState());
  readTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); buildChal(); });
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  buildShop(); afterLoad();
  if (!hot) { const sec = (Date.now() - (S.lastSave || Date.now())) / 1000; if (sec > 60) away(sec); }
  resize(); new ResizeObserver(resize).observe(stage);

  if (!REDUCED) {
    const T = document.getElementById('wobT'); let sd = 1;
    setInterval(() => { sd = sd % 3 + 1; T.setAttribute('seed', sd); }, 160);
  }
  let last = performance.now(), lastWall = Date.now(), lastUI = 0, lastAch = 0, lastSaveT = performance.now();
  function frame(now) {
    const wall = Date.now(), gap = (wall - lastWall) / 1000; lastWall = wall;
    let dt = Math.min((now - last) / 1000, 60); last = now;
    if (gap > 60) { away(gap); dt = 0.016; }
    tNow += Math.min(dt, 0.1);
    if (!REDUCED) boil = Math.floor(now / 140) % 3;
    tick(dt);
    draw(Math.min(dt, 0.1));
    if (now - lastUI > 100) { lastUI = now; updateUI(false); }
    if (now - lastAch > 500) { lastAch = now; checkAch(false); }
    if (now - lastSaveT > 15000) { lastSaveT = now; save(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => updateUI(true));
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) { /* ignore */ }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
